name: Test fail-on-cache-miss
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: miss-target
          key: act-test-fail-miss-${{ github.run_id }}-nonexistent
          fail-on-cache-miss: 'true'
      - name: Assert miss is reported (failure, or no hit if cache service unavailable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: '$HIT'"
          if [ "$HIT" = "true" ]; then
            echo "FAIL: unexpected cache hit"
            exit 1
          fi
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed on cache miss as requested"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: cache service unavailable outside WarpBuild; no hit reported"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
