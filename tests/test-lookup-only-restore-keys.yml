name: Test lookup-only with restore-keys
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare paths
        run: |
          mkdir -p "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
          echo a > "$RUNNER_TEMP/a/a.txt"
          echo b > "$RUNNER_TEMP/b/b.txt"
      - id: action
        uses: .
        env:
          WARPBUILD_RUNNER_VERIFICATION_TOKEN: ""
        with:
          path: |
            ${{ runner.temp }}/a
            ${{ runner.temp }}/b
          key: test-lookup-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            test-lookup-${{ runner.os }}-
            test-lookup-
          lookup-only: "true"
          enableCrossOsArchive: "true"
          enableCrossArchArchive: "true"
      - name: Assert cache-hit is false
        env:
          ACTUAL: ${{ steps.action.outputs.cache-hit }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "cache-hit: $ACTUAL"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected cache-hit 'false'"
            exit 1
          fi
          [ "$(cat "$RUNNER_TEMP/a/a.txt")" = "a" ] || { echo "FAIL: a changed"; exit 1; }
          [ "$(cat "$RUNNER_TEMP/b/b.txt")" = "b" ] || { echo "FAIL: b changed"; exit 1; }
          echo "PASS"
