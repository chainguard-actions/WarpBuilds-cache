name: Test lookup-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: ${{ runner.temp }}/lookup-dir
          key: test-lookup-${{ github.run_id }}
          lookup-only: "true"
      - name: Assert lookup does not hit and path is not created
        env:
          ACTUAL: ${{ steps.action.outputs.cache-hit }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $ACTUAL"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success outcome"
            exit 1
          fi
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected cache-hit 'false'"
            exit 1
          fi
          if [ -e "$RUNNER_TEMP/lookup-dir" ]; then
            echo "FAIL: lookup-only must not restore files"
            exit 1
          fi
          echo "PASS"
