name: Test fail-on-cache-miss without cache service
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare path
        run: mkdir -p "$RUNNER_TEMP/miss-dir"
      - id: action
        uses: .
        env:
          WARPBUILD_RUNNER_VERIFICATION_TOKEN: ""
        with:
          path: ${{ runner.temp }}/miss-dir
          key: test-miss-${{ github.run_id }}-nonexistent
          fail-on-cache-miss: "true"
      - name: Assert graceful no-op
        env:
          ACTUAL: ${{ steps.action.outputs.cache-hit }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "cache-hit: $ACTUAL"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when cache feature is unavailable"
            exit 1
          fi
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected cache-hit 'false'"
            exit 1
          fi
          echo "PASS"
