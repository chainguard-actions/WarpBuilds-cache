name: Test fail-on-cache-miss when cache service unavailable
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          WARPBUILD_RUNNER_VERIFICATION_TOKEN: ""
        with:
          path: |
            some-dir
            another-dir/*.txt
          key: test-fail-miss-${{ github.sha }}
          fail-on-cache-miss: "true"
      - name: Assert graceful skip (service unavailable does not count as miss)
        env:
          ACTUAL: ${{ steps.action.outputs.cache-hit }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "cache-hit: $ACTUAL"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success outcome"
            exit 1
          fi
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected cache-hit 'false'"
            exit 1
          fi
          echo "PASS"
