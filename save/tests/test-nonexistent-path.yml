name: Test save with a path that matches nothing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: does-not-exist-dir/**
          key: act-test-missing-${{ github.run_id }}
      - name: Assert save failure is non-fatal (logged as warning)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected the save-only action to warn, not fail"
            exit 1
          fi
          echo "PASS"
