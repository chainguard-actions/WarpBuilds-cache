name: Test save with nonexistent path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: this-path-does-not-exist-${{ github.run_id }}
          key: act-test-missing-${{ github.run_id }}
      - name: Assert action did not fail the job (missing path only warns)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success (save should only warn)"
            exit 1
          fi
          echo "PASS"
