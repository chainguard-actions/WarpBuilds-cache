name: Test save with a path that does not exist
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: does-not-exist-dir
          key: act-test-missing-${{ github.run_id }}
      - name: Assert action handled missing path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          if [ -e does-not-exist-dir ]; then
            echo "FAIL: action should not create the missing path"
            exit 1
          fi
          echo "PASS"
