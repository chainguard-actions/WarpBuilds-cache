name: Test save with multiple paths and options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create files to cache
        run: |
          mkdir -p dir-a dir-b/nested
          echo "a" > dir-a/a.txt
          echo "b" > dir-b/nested/b.log
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: |
            dir-a
            dir-b/**/*.log
          key: act-test-multi-${{ github.run_id }}
          upload-chunk-size: '33554432'
          enableCrossOsArchive: 'true'
          enableCrossArchArchive: 'true'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          for f in dir-a/a.txt dir-b/nested/b.log; do
            if [ ! -f "$f" ]; then
              echo "FAIL: $f missing after save"
              exit 1
            fi
          done
          echo "PASS"
