name: Test save with cross-OS archive enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create file to cache
        run: |
          mkdir -p xos
          echo "cross" > xos/data.bin
      - id: action
        uses: .
        with:
          path: xos/data.bin
          key: act-test-xos-${{ github.run_id }}
          enableCrossOsArchive: 'true'
      - name: Assert step succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ "$(cat xos/data.bin)" != "cross" ]; then
            echo "FAIL: file content changed"
            exit 1
          fi
          echo "PASS"
