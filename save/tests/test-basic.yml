name: Test basic save
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create files to cache
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cache-dir/sub"
          echo "hello cache" > "$GITHUB_WORKSPACE/cache-dir/file.txt"
          echo "nested" > "$GITHUB_WORKSPACE/cache-dir/sub/nested.txt"
      - id: action
        uses: .
        with:
          path: cache-dir
          key: act-test-basic-${{ github.run_id }}
      - name: Assert step succeeded and cached files are untouched
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ "$(cat "$GITHUB_WORKSPACE/cache-dir/file.txt")" != "hello cache" ]; then
            echo "FAIL: cached file content changed"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/cache-dir/sub/nested.txt" ]; then
            echo "FAIL: nested file missing"
            exit 1
          fi
          echo "PASS"
