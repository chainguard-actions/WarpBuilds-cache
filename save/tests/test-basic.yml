name: Test basic save
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create files to cache
        run: |
          mkdir -p cache-dir
          echo "hello cache" > cache-dir/file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: cache-dir
          key: act-test-basic-${{ github.run_id }}
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The WarpBuild cache backend may be unreachable outside WarpBuild runners;
          # the save action typically warns instead of failing.
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          if [ ! -f cache-dir/file.txt ] || [ "$(cat cache-dir/file.txt)" != "hello cache" ]; then
            echo "FAIL: cached path was modified or removed"
            exit 1
          fi
          echo "PASS"
